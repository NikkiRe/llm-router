[project]
name = "llmbench"
version = "0.1.0"
description = "Benchmark for llm-router routing policies"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
